[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hww-toolbox"
version = "0.1.0"
description = "Truth- and reconstruction-level ML toolbox for the boosted HWW analysis"
requires-python = ">=3.11"
dependencies = [
  "awkward>=2.6",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "torch>=2.2",
  "uproot>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
